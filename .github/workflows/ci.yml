name: Warehouse MARL CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "integration/**"]

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run unit tests (excluding slow integration tests)
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_optuna_study.py \
            --ignore=tests/test_monitoring.py \
            --ignore=tests/test_pybullet_simulation.py \
            -x -q --tb=short

      - name: Safety smoke gate (rule-based, 5 episodes)
        run: |
          python -m pytest tests/test_warehouse_backend.py tests/test_p6_checkpoint_compatibility.py -q --tb=short

  frontend-checks:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend -- --run

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Vite production build
        run: npm run build

  checkpoint-compatibility:
    name: P6 Checkpoint Compatibility Tests
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run P6 checkpoint compatibility tests
        run: |
          python -m pytest tests/test_p6_checkpoint_compatibility.py -v --tb=short

  onnx-export:
    name: ONNX Export Tests
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run ONNX export tests
        run: |
          python -m pytest tests/test_onnx_export.py -v --tb=short
